    <h1>Что такое бизнес-информатика?</h1>
    <p>Бизнес-информатика — это междисциплинарное направление, которое объединяет экономику, управление и информационные технологии.</p>
    <p>Специалисты в этой области помогают компаниям внедрять IT-решения, анализировать данные и оптимизировать бизнес-процессы.</p>
